<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اذان واچ</title>
<meta name="theme-color" content="#0b3a5b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:'AWNastaliq';src:url('fonts/nastaliq-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'AWNastaliq';src:url('fonts/nastaliq-700.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--bg1:#0b3a5b;--bg2:#0f172a;--fg:#fff;--card:rgba(255,255,255,.06);--accent:#ffcc00}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--fg);background:var(--bg2)}
body{font-family:'AWNastaliq','Noto Nastaliq Urdu','Noto Naskh Arabic','Segoe UI',Roboto,sans-serif;line-height:1.9;
  background:linear-gradient(135deg,var(--bg2),var(--bg1)) fixed;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.watch{max-width:460px;margin:0 auto;border-radius:18px;padding:16px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));box-shadow:0 10px 30px rgba(2,6,23,.55)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.small{font-size:13px;opacity:.92}
.num{font-family:'Segoe UI',Roboto,Arial,sans-serif;direction:ltr;unicode-bidi:isolate;display:inline-block;line-height:1.3}
.clock{text-align:center;font-size:52px;font-weight:700;margin:10px 0 2px;letter-spacing:1px}
.clock .num{line-height:1.2}
.dates{display:flex;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap}
.next{margin-top:12px;border-radius:12px;padding:10px 12px;background:rgba(255,204,0,.12);border:1px solid rgba(255,204,0,.35);display:flex;justify-content:space-between;align-items:center;gap:8px}
.next b{color:var(--accent)}
.list{margin-top:12px;border-radius:12px;padding:6px 8px;background:var(--card)}
.prayer{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px dashed rgba(255,255,255,.12);font-size:18px}
.prayer:last-child{border-bottom:none}
.prayer.next-one{color:var(--accent);font-weight:700}
.prayer.passed{opacity:.55}
.btn{display:block;width:100%;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:inherit;font:inherit;font-size:14px;text-align:center;cursor:pointer}
.btn:active{background:rgba(255,255,255,.18)}
.btn.gold{background:var(--accent);color:#0f172a;font-weight:700;border-color:var(--accent)}
select,input[type=file]{width:100%;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(15,23,42,.65);color:inherit;font:inherit;font-size:14px}
select option{color:#000}
details{margin-top:12px;border-radius:12px;background:var(--card);padding:6px 12px}
summary{cursor:pointer;padding:6px 0;font-size:15px}
.field{margin:10px 0}
.field label{display:block;font-size:13px;opacity:.9;margin-bottom:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=color]{width:100%;height:40px;border:none;border-radius:10px;padding:0;background:none}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:20px;height:20px}
#msg{min-height:20px;font-size:12px;color:#ffd966;margin-top:6px}
.brand{margin-top:14px;text-align:center;font-size:14px;opacity:.95}
</style>
</head>
<body>
<div class="watch">
  <div class="top">
    <div>اذان واچ</div>
    <div id="place" class="small">مقام: --</div>
  </div>

  <div class="clock"><span class="num" id="clock">--:--:--</span></div>

  <div class="dates">
    <div id="hijri">ہجری: --</div>
    <div id="gdate">--</div>
    <div id="shamsi">شمسی: --</div>
  </div>

  <div class="next">
    <div>اگلی نماز: <b id="nextName">--</b></div>
    <div><span class="num" id="countdown">--:--:--</span></div>
  </div>

  <div class="list" id="prayers"></div>

  <div style="margin-top:12px"><button class="btn gold" id="testBtn" type="button">اذان ٹیسٹ کریں</button></div>
  <div id="msg"></div>

  <details>
    <summary>ترتیبات</summary>

    <div class="field">
      <label for="city">شہر</label>
      <select id="city"></select>
    </div>
    <div class="field">
      <button class="btn" id="gpsBtn" type="button">موجودہ مقام (GPS) حاصل کریں</button>
    </div>

    <div class="two">
      <div class="field">
        <label for="method">حساب کا طریقہ</label>
        <select id="method">
          <option value="Karachi">کراچی (پاکستان)</option>
          <option value="MuslimWorldLeague">مسلم ورلڈ لیگ</option>
          <option value="NorthAmerica">شمالی امریکہ (ISNA)</option>
          <option value="Egyptian">مصر</option>
          <option value="UmmAlQura">ام القریٰ</option>
          <option value="MoonsightingCommittee">مون سائٹنگ کمیٹی</option>
          <option value="Tehran">تہران</option>
        </select>
      </div>
      <div class="field">
        <label for="madhab">عصر کا مسلک</label>
        <select id="madhab">
          <option value="Hanafi">حنفی (دوگنا سایہ)</option>
          <option value="Shafi">شافعی (ایک گنا سایہ)</option>
        </select>
      </div>
    </div>

    <div class="two">
      <div class="field">
        <label for="offset">ہجری تاریخ میں فرق</label>
        <select id="offset">
          <option value="-2">-2 دن</option>
          <option value="-1">-1 دن</option>
          <option value="0">0 (بغیر فرق)</option>
          <option value="1">+1 دن</option>
          <option value="2">+2 دن</option>
        </select>
      </div>
      <div class="field">
        <label for="hfmt">وقت کا انداز</label>
        <select id="hfmt">
          <option value="12">12 گھنٹے</option>
          <option value="24">24 گھنٹے</option>
        </select>
      </div>
    </div>

    <div class="field chk">
      <input type="checkbox" id="azanOn"><label for="azanOn" style="margin:0">وقت پر اذان بجائیں</label>
    </div>

    <div class="field">
      <label for="azanFile">اپنی اذان کی آڈیو فائل</label>
      <input type="file" id="azanFile" accept="audio/*">
      <button class="btn" id="resetAzan" type="button" style="margin-top:6px">ڈیفالٹ آواز بحال کریں</button>
    </div>

    <div class="two">
      <div class="field"><label for="c1">رنگ ۱</label><input type="color" id="c1"></div>
      <div class="field"><label for="c2">رنگ ۲</label><input type="color" id="c2"></div>
    </div>
  </details>

  <div class="brand">مفتی شعیب خان آلائی</div>
</div>

<audio id="azanAudio" preload="auto"></audio>

<script src="adhan.umd.min.js"></script>
<script src="azan-audio.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('aw_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('aw_' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem('aw_' + k); } catch (e) {} }
  };
  function msg(t) { $('msg').textContent = t || ''; }

  if (typeof adhan === 'undefined') { msg('خرابی: نماز کے حساب کی لائبریری لوڈ نہیں ہوئی۔'); return; }

  var CITIES = [
    ['کراچی', 24.8607, 67.0011], ['لاہور', 31.5497, 74.3436], ['اسلام آباد', 33.6844, 73.0479],
    ['راولپنڈی', 33.5651, 73.0169], ['پشاور', 34.0151, 71.5249], ['مانسہرہ', 34.3333, 73.2000],
    ['ایبٹ آباد', 34.1688, 73.2215], ['کوئٹہ', 30.1798, 66.9750], ['ملتان', 30.1575, 71.5249],
    ['فیصل آباد', 31.4504, 73.1350], ['حیدرآباد', 25.3960, 68.3578], ['سیالکوٹ', 32.4945, 74.5229],
    ['گوجرانوالہ', 32.1877, 74.1945], ['مکہ مکرمہ', 21.3891, 39.8579], ['مدینہ منورہ', 24.4672, 39.6111]
  ];
  var PRAYERS = [['fajr', 'فجر'], ['sunrise', 'طلوعِ آفتاب'], ['dhuhr', 'ظہر'], ['asr', 'عصر'], ['maghrib', 'مغرب'], ['isha', 'عشاء']];
  var AZAN_KEYS = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
  var NAME = {}; PRAYERS.forEach(function (p) { NAME[p[0]] = p[1]; });
  var HIJRI_MONTHS = ['محرم', 'صفر', 'ربیع الاول', 'ربیع الثانی', 'جمادی الاول', 'جمادی الثانی', 'رجب', 'شعبان', 'رمضان', 'شوال', 'ذوالقعدہ', 'ذوالحجہ'];
  var DAYS = ['اتوار', 'پیر', 'منگل', 'بدھ', 'جمعرات', 'جمعہ', 'ہفتہ'];

  var S = {
    method: store.get('method', 'Karachi'), madhab: store.get('madhab', 'Hanafi'),
    lat: store.get('lat', 24.8607), lng: store.get('lng', 67.0011), place: store.get('place', 'کراچی'),
    offset: store.get('offset', 0), h12: store.get('h12', true), azan: store.get('azan', true),
    c1: store.get('c1', '#0b3a5b'), c2: store.get('c2', '#0f172a')
  };

  function two(n) { return n < 10 ? '0' + n : '' + n; }
  function fmt(d, withSec) {
    var h = d.getHours(), m = d.getMinutes(), s = d.getSeconds(), suf = '';
    if (S.h12) { suf = h >= 12 ? ' PM' : ' AM'; h = h % 12 || 12; } else { h = two(h); }
    return h + ':' + two(m) + (withSec ? ':' + two(s) : '') + suf;
  }
  function span(txt) { var s = document.createElement('span'); s.className = 'num'; s.textContent = txt; return s; }

  // ---------- dates ----------
  function parts(date, cal) {
    try {
      var f = new Intl.DateTimeFormat('en-u-ca-' + cal + '-nu-latn', { day: 'numeric', month: 'numeric', year: 'numeric' });
      var o = {};
      f.formatToParts(date).forEach(function (p) { o[p.type] = p.value; });
      var y = parseInt(o.year, 10), m = parseInt(o.month, 10), d = parseInt(o.day, 10);
      if (y && m && d) return { y: y, m: m, d: d };
    } catch (e) {}
    return null;
  }
  function hijriFallback(date) { // tabular Kuwaiti algorithm
    var gd = date.getDate(), gm = date.getMonth() + 1, gy = date.getFullYear();
    var a = Math.floor((14 - gm) / 12), y = gy + 4800 - a, m = gm + 12 * a - 3;
    var jd = gd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
    var l = jd - 1948440 + 10632, n = Math.floor((l - 1) / 10631);
    l = l - 10631 * n + 354;
    var j = Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719) + Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
    l = l - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
    var mm = Math.floor((24 * l) / 709), dd = l - Math.floor((709 * mm) / 24);
    return { y: 30 * n + j - 30, m: mm, d: dd };
  }
  function updateDates() {
    var now = new Date();
    var shifted = new Date(now.getTime() + S.offset * 86400000);
    var h = parts(shifted, 'islamic-umalqura') || hijriFallback(shifted);
    $('hijri').textContent = 'ہجری: ' + h.d + ' ' + (HIJRI_MONTHS[h.m - 1] || h.m) + ' ' + h.y;
    var p = parts(now, 'persian');
    $('shamsi').textContent = p ? 'شمسی: ' + p.d + ' / ' + p.m + ' / ' + p.y : 'شمسی: --';
    $('gdate').textContent = DAYS[now.getDay()] + '، ' + now.getDate() + ' / ' + (now.getMonth() + 1) + ' / ' + now.getFullYear();
  }

  // ---------- prayer times ----------
  var today = {}, tomorrowFajr = null, dayKey = '';
  function compute(date) {
    var fn = adhan.CalculationMethod[S.method] || adhan.CalculationMethod.Karachi;
    var params = fn();
    params.madhab = (S.madhab === 'Shafi') ? adhan.Madhab.Shafi : adhan.Madhab.Hanafi;
    return new adhan.PrayerTimes(new adhan.Coordinates(S.lat, S.lng), date, params);
  }
  function dateKey(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
  function recompute() {
    var now = new Date();
    dayKey = dateKey(now);
    var t = compute(now);
    today = { fajr: t.fajr, sunrise: t.sunrise, dhuhr: t.dhuhr, asr: t.asr, maghrib: t.maghrib, isha: t.isha };
    tomorrowFajr = compute(new Date(now.getTime() + 86400000)).fajr;
    $('place').textContent = 'مقام: ' + S.place;
    renderList();
  }
  function nextPrayer(now) {
    for (var i = 0; i < AZAN_KEYS.length; i++) {
      var k = AZAN_KEYS[i];
      if (today[k] > now) return { key: k, time: today[k] };
    }
    return { key: 'fajr', time: tomorrowFajr };
  }
  function renderList() {
    var box = $('prayers'), now = new Date(), nx = nextPrayer(now);
    box.textContent = '';
    PRAYERS.forEach(function (p) {
      var k = p[0], row = document.createElement('div');
      row.className = 'prayer' + (k === nx.key && nx.time === today[k] ? ' next-one' : '') + (today[k] <= now ? ' passed' : '');
      var a = document.createElement('div'); a.textContent = p[1];
      var b = document.createElement('div'); b.appendChild(span(fmt(today[k], false)));
      row.appendChild(a); row.appendChild(b); box.appendChild(row);
    });
  }

  // ---------- audio ----------
  var audio = $('azanAudio');
  function defaultAzan() { audio.src = window.AZAN_DEFAULT || 'azan_alert.mp3'; }
  function loadAzan() {
    var saved = store.get('azanData', null);
    if (saved) { audio.src = saved; } else { defaultAzan(); }
  }
  function playAzan() {
    try { audio.currentTime = 0; } catch (e) {}
    var pr = audio.play();
    if (pr && pr.catch) pr.catch(function () { msg('آواز چلانے کے لیے اسکرین پر ایک بار ٹچ کریں۔'); });
  }
  document.addEventListener('pointerdown', function unlock() {
    document.removeEventListener('pointerdown', unlock);
    audio.muted = true;
    var pr = audio.play();
    var done = function () { audio.pause(); try { audio.currentTime = 0; } catch (e) {} audio.muted = false; };
    if (pr && pr.then) pr.then(done, function () { audio.muted = false; }); else done();
  });
  $('testBtn').onclick = function () { msg(''); playAzan(); };
  $('azanFile').onchange = function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      audio.src = r.result; audio.load();
      var ok = store.set('azanData', r.result);
      msg(ok ? 'آپ کی اذان محفوظ ہو گئی۔' : 'فائل لگ گئی، مگر بڑی ہونے کی وجہ سے ایپ بند ہونے پر محفوظ نہیں رہے گی۔');
    };
    r.onerror = function () { msg('فائل نہیں کھل سکی۔'); };
    r.readAsDataURL(f);
  };
  $('resetAzan').onclick = function () { store.del('azanData'); defaultAzan(); msg('ڈیفالٹ آواز بحال ہو گئی۔'); };

  // ---------- settings UI ----------
  var citySel = $('city');
  var custom = document.createElement('option'); custom.value = 'gps'; custom.textContent = 'GPS / حسبِ ضرورت'; citySel.appendChild(custom);
  CITIES.forEach(function (c) { var o = document.createElement('option'); o.value = c[1] + ',' + c[2]; o.textContent = c[0]; o.dataset.name = c[0]; citySel.appendChild(o); });
  function syncCity() {
    var v = S.lat + ',' + S.lng, found = false;
    for (var i = 0; i < citySel.options.length; i++) { if (citySel.options[i].value === v) { citySel.selectedIndex = i; found = true; } }
    if (!found) citySel.value = 'gps';
  }
  citySel.onchange = function () {
    if (citySel.value === 'gps') return;
    var o = citySel.options[citySel.selectedIndex], xy = citySel.value.split(',');
    S.lat = parseFloat(xy[0]); S.lng = parseFloat(xy[1]); S.place = o.dataset.name;
    store.set('lat', S.lat); store.set('lng', S.lng); store.set('place', S.place);
    recompute(); msg('');
  };
  $('gpsBtn').onclick = function () {
    if (!navigator.geolocation) { msg('اس ڈیوائس پر مقام کی سہولت دستیاب نہیں۔'); return; }
    msg('مقام تلاش ہو رہا ہے…');
    navigator.geolocation.getCurrentPosition(function (pos) {
      S.lat = pos.coords.latitude; S.lng = pos.coords.longitude;
      S.place = S.lat.toFixed(3) + ', ' + S.lng.toFixed(3);
      store.set('lat', S.lat); store.set('lng', S.lng); store.set('place', S.place);
      syncCity(); recompute(); msg('مقام اپڈیٹ ہو گیا۔');
    }, function () {
      msg('مقام حاصل نہیں ہوا۔ فون کی لوکیشن آن اور ایپ کو اجازت دیں، یا اوپر فہرست سے شہر چنیں۔');
    }, { timeout: 20000, maximumAge: 600000 });
  };
  $('method').value = S.method; $('madhab').value = S.madhab; $('offset').value = String(S.offset);
  $('hfmt').value = S.h12 ? '12' : '24'; $('azanOn').checked = !!S.azan;
  $('method').onchange = function () { S.method = this.value; store.set('method', S.method); recompute(); };
  $('madhab').onchange = function () { S.madhab = this.value; store.set('madhab', S.madhab); recompute(); };
  $('offset').onchange = function () { S.offset = parseInt(this.value, 10) || 0; store.set('offset', S.offset); updateDates(); };
  $('hfmt').onchange = function () { S.h12 = this.value === '12'; store.set('h12', S.h12); renderList(); };
  $('azanOn').onchange = function () { S.azan = this.checked; store.set('azan', S.azan); };
  function applyColors() {
    document.documentElement.style.setProperty('--bg1', S.c1);
    document.documentElement.style.setProperty('--bg2', S.c2);
  }
  $('c1').value = S.c1; $('c2').value = S.c2;
  $('c1').oninput = function () { S.c1 = this.value; store.set('c1', S.c1); applyColors(); };
  $('c2').oninput = function () { S.c2 = this.value; store.set('c2', S.c2); applyColors(); };

  // ---------- main tick ----------
  var fired = {};
  function tick() {
    var now = new Date();
    $('clock').textContent = fmt(now, true).replace(/ (AM|PM)$/, '');
    if (dateKey(now) !== dayKey) { recompute(); updateDates(); }
    var nx = nextPrayer(now), diff = Math.max(0, nx.time - now), s = Math.floor(diff / 1000);
    $('nextName').textContent = NAME[nx.key];
    $('countdown').textContent = two(Math.floor(s / 3600)) + ':' + two(Math.floor(s / 60) % 60) + ':' + two(s % 60);
    for (var i = 0; i < AZAN_KEYS.length; i++) {
      var k = AZAN_KEYS[i], t = today[k], d = now - t, key = dayKey + k;
      if (d >= 0 && d < 45000 && !fired[key]) { fired[key] = true; if (S.azan) playAzan(); renderList(); }
    }
    if (now.getSeconds() === 0) renderList();
  }

  applyColors(); loadAzan(); syncCity(); recompute(); updateDates(); tick();
  setInterval(tick, 1000);
  setInterval(updateDates, 60000);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('service-worker.js').catch(function () {});
  }
})();
</script>
</body>
</html>
