name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Code checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 17 setup
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Android SDK setup (یہاں packages میں صرف platform-tools)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 4. Gradle cache
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Gradle wrapper کو executable بنائیں
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. Debug APK build کریں
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 7. Debug APK artifact کے طور پر upload کریں
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      # 8. (اختیاری) Release APK build کریں
      # یہ تب کام کرے گا جب آپ کے پاس signing config ہو
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      # 9. Release APK artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
        continue-on-error: true
